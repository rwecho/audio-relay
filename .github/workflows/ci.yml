name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server (.NET, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore server/AudioRelay.slnx

      - name: Build
        run: dotnet build server/AudioRelay.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test server/AudioRelay.slnx --configuration Release --no-build --verbosity normal

      - name: Publish (self-contained win-x64)
        run: dotnet publish server/src/AudioRelay.App/AudioRelay.App.csproj --configuration Release --runtime win-x64 --self-contained true -o server/publish/win-x64

      - name: Zip publish output
        shell: pwsh
        run: Compress-Archive -Path server/publish/win-x64/* -DestinationPath server/audio-relay-server-win-x64.zip -CompressionLevel Optimal

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-relay-server-win-x64
          path: server/audio-relay-server-win-x64.zip
          if-no-files-found: error

  client:
    name: Client (Flutter, Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter doctor
        run: flutter --version
        working-directory: client

      - name: Create Android platform scaffold
        run: flutter create --platforms=android --project-name audio_relay_client .
        working-directory: client

      - name: Pub get
        run: flutter pub get
        working-directory: client

      - name: Analyze
        run: flutter analyze
        working-directory: client
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release
        working-directory: client

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-relay-android
          path: client/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
